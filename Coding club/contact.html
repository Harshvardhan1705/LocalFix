<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - LocalFix</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: #fdfdfd;
    }

    /* Navbar Style */
    .navbar {
      background: linear-gradient(to right, #28a745, #218838);
    }

    .navbar-brand {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .nav-link {
      color: #fff !important;
      font-weight: 500;
      transition: all 0.3s ease-in-out;
    }

    .nav-link:hover {
      color: #ffc107 !important;
      transform: scale(1.05);
    }

    /* Contact Form Styling */
    .contact-section {
      max-width: 800px;
      margin: 50px auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .contact-section h2 {
      text-align: center;
      margin-bottom: 25px;
      color: green;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-rating {
      display: flex;
      gap: 15px;
      margin: 10px 0;
      flex-wrap: wrap;
    }

    .form-rating label {
      font-weight: normal;
    }

    .submit-btn {
      background: green;
      color: #fff;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background: #1e7e34;
    }
  </style>
</head>
<body>

<!-- Responsive Bootstrap Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">LocalFix</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="home-services.html">Home Services</a></li>
        <li class="nav-item"><a class="nav-link" href="education-tutoring.html">Education & Tutoring</a></li>
        <li class="nav-item"><a class="nav-link" href="Health&wellness.html">Health & Wellness</a></li>
        <li class="nav-item"><a class="nav-link" href="personal-services.html">Personal Services</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Contact Section -->
<section class="contact-section">
  <h2><b>📬 Contact Us & Feedback</b></h2>
  <form>
    <div class="form-group">
      <label for="name">Your Name *</label>
      <input type="text" id="name" name="name" placeholder="FirstName MiddleName LastName" required />
    </div>

    <div class="form-group">
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />
    </div>

    <div class="form-group">
      <label for="service">Which service did you use?</label>
      <select id="service" name="service">
        <option>Home Services</option>
        <option>Education & Tutoring</option>
        <option>Health & Wellness</option>
        <option>Personal Services</option>
      </select>
    </div>

    <div class="form-group">
      <label>How satisfied are you with our platform?</label>
      <div class="form-rating">
        <label><input type="radio" name="satisfaction" value="Excellent" required> 😍 Excellent</label>
        <label><input type="radio" name="satisfaction" value="Good"> 🙂 Good</label>
        <label><input type="radio" name="satisfaction" value="Average"> 😐 Average</label>
        <label><input type="radio" name="satisfaction" value="Poor"> 😕 Poor</label>
      </div>
    </div>

    <div class="form-group">
      <label for="message">Your Feedback / Suggestions</label>
      <textarea id="message" name="message" placeholder="Let us know how we can improve..."></textarea>
    </div>

    <button type="submit" class="submit-btn">Submit Feedback</button>
  </form>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
