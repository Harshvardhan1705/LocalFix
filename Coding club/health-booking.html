<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book a Service</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .booking-form {
      max-width: 500px;
      margin: 50px auto;
      padding: 30px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="booking-form">
    <h2 class="text-center mb-4">Book a Service</h2>
    
    <form onsubmit="handleBooking(event)">
      <div class="mb-3">
        <label class="form-label">Your Name</label>
        <input type="text" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Mobile Number</label>
        <input type="tel" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Service Required</label>
        <select class="form-select" required>
          <option value="">Select Service</option>
          <option>Yoga Instructor</option>
          <option>Fittness Trainer</option>
          <option>Dieticians and Nutritionist</option>
        </select>
      </div>

      <h4 class="text-center mb-4" id="servicemanName">Booking for: </h4>

      <div class="mb-3">
        <label class="form-label">Preferred Date</label>
        <input type="date" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Payable Amount (Minimum ₹500)</label>
        <input type="number" class="form-control" id="amount" min="300" required>
      </div>

      <div class="alert alert-warning text-center">
        💡 *Minimum payment is ₹500. Additional charges will be discussed after inspection.*
      </div>

      <button type="submit" class="btn btn-success w-100">Pay & Confirm</button>
    </form>
  </div>
</div>

<script>
  function handleBooking(event) {
    event.preventDefault();
    const amount = parseInt(document.getElementById('amount').value);
    if (amount < 500) {
      alert("Minimum payment must be ₹500.");
      return;
    }
    alert("Redirecting to payment gateway for ₹" + amount + "...");
    window.location.href = "health-payment-confirmed.html"; 
  }
  const urlParams = new URLSearchParams(window.location.search);
  const name = urlParams.get('name');
  if (name) {
    document.getElementById('servicemanName').innerText = "Booking for: " + decodeURIComponent(name);
  }
</script>


</body>
</html>
